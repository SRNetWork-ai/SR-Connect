# SR-Connect — پشته‌ی کامل روی یک VPS کوچک (از ۱ هسته / ۲ گیگ به بالا)
#
# به‌صورت پیش‌فرض ایمیج‌های آماده از GHCR کشیده می‌شوند تا سرور مجبور به بیلد نباشد.
# برای بیلد محلی، در .env مقدار SR_IMAGE_WEB/SR_IMAGE_GATEWAY را عوض کن و
# `docker compose build` بزن. راه‌اندازی از طریق deploy/scripts/install.sh است.
name: sr-connect

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SR_DOMAIN: "${SR_DOMAIN}"
      SR_ACME_EMAIL: "${SR_ACME_EMAIL}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
      - gateway
    networks: [sr]

  web:
    image: "${SR_IMAGE_WEB:-ghcr.io/srnetwork-ai/sr-connect-web:latest}"
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_VERSION: "${SR_VERSION:-1.0.0}"
        NEXT_PUBLIC_UPDATE_PUBKEY: "${UPDATE_PUBKEY}"
        NEXT_PUBLIC_API_VERSION: "4"
        NEXT_PUBLIC_GATEWAY_URL: "wss://${SR_DOMAIN}/ws"
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: "postgres://sr:${POSTGRES_PASSWORD}@postgres:5432/srconnect"
      LIVEKIT_URL: "ws://host.docker.internal:7880"
      LIVEKIT_PUBLIC_URL: "wss://${SR_DOMAIN}/rtc"
      RELEASES_DIR: /srv/releases
      UPLOADS_DIR: /srv/uploads
    volumes:
      - ./releases:/srv/releases
      - ./uploads:/srv/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sr]

  gateway:
    image: "${SR_IMAGE_GATEWAY:-ghcr.io/srnetwork-ai/sr-connect-gateway:latest}"
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: "postgres://sr:${POSTGRES_PASSWORD}@postgres:5432/srconnect"
      GATEWAY_PORT: "4001"
      APP_VERSION: "${SR_VERSION:-1.0.0}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sr]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sr
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: srconnect
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # مقادیر را install.sh بر اساس رم واقعی سرور در .env می‌نویسد.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-50}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sr -d srconnect"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sr]

  livekit:
    image: livekit/livekit-server:v1.8
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    # WebRTC به بازه‌ی بزرگی از پورت‌های UDP نیاز دارد؛ host کم‌تأخیرترین حالت است.
    network_mode: host
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  sr:
    driver: bridge
